name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution, first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This keeps Tidewell read-only towards external accounts (or I explain why it shouldn't).
        - label: I'd like to work on this myself.
