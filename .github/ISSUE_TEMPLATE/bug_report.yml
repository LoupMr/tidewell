name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! **Security issues:** please use a private advisory instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Calendar, Inbox, GitHub, Money, CSV import, Accounts / auth, Sync, Deployment, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `docker compose logs tidewell` or the Recent syncs panel. **Remove tokens and email addresses.**"
      render: text
